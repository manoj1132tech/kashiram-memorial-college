<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarship Form Portal | Kashiram Memorial College</title>
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { 
      --primary-color: #003366; 
      --accent-color: #ffcc00; 
      --text-dark: #1e293b;
      --text-light: #ffffff; 
      --bg-soft: #f0f4f8; 
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body { 
      background-color: var(--bg-soft); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
    }

    .upload-card-wrapper {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border-top: 5px solid var(--primary-color);
    }

    .card-header {
      background: var(--primary-color);
      color: var(--text-light);
      padding: 22px 20px;
      text-align: center;
    }

    .card-header .icon-box {
      width: 55px;
      height: 55px;
      background: rgba(255, 255, 255, 0.15);
      color: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 10px;
    }

    .card-header h2 { font-size: 1.25rem; font-weight: 600; }
    .card-header p { font-size: 0.8rem; color: #cbd5e1; margin-top: 3px; }

    /* Tabs for Upload & Download */
    .nav-tabs {
      display: flex;
      background: #e2e8f0;
    }
    .nav-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border: none;
      background: none;
      transition: 0.3s;
    }
    .nav-tab.active {
      background: #ffffff;
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
    }

    .card-body { padding: 25px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 5px;
    }
    .form-group label i { color: var(--primary-color); margin-right: 5px; }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.9rem;
      background-color: #f8fafc;
      outline: none;
    }
    .form-group input[type="file"] { padding: 7px; background: #fff; cursor: pointer; }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: var(--text-light);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .submit-btn:hover { background: #002244; }

    /* Proof / Receipt Card */
    #receiptBox {
      display: none;
      background: #f8fafc;
      border: 2px dashed #10b981;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
    }
    #receiptBox h4 { color: #059669; font-size: 1rem; margin-bottom: 8px; text-align: center; }
    #receiptBox p { font-size: 0.85rem; color: #334155; margin-bottom: 5px; }
    .print-slip-btn {
      background: #10b981;
      color: white;
      border: none;
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Download Results Style */
    .result-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .result-card p { font-size: 0.85rem; color: var(--text-dark); word-break: break-all; }
    .btn-group { display: flex; gap: 8px; }
    .dl-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .dl-btn-view { background: #e0f2fe; color: #0284c7; }
    .dl-btn-down { background: var(--primary-color); color: white; }
  </style>
</head>
<body>

  <div class="upload-card-wrapper">
    <div class="card-header">
      <div class="icon-box"><i class="fas fa-file-pdf"></i></div>
      <h2>Scholarship Portal</h2>
      <p>Kashiram Memorial College</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('uploadTab', this)">Upload Form</button>
      <button class="nav-tab" onclick="switchTab('downloadTab', this)">Download / Print Slip</button>
    </div>

    <div class="card-body">
      <!-- TAB 1: UPLOAD FORM -->
      <div id="uploadTab" class="tab-content active">
        <form id="scholarshipUploadForm">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Student Full Name:</label>
            <input type="text" id="studentName" placeholder="Enter full name" required>
          </div>

          <div class="form-group">
            <label><i class="fas fa-graduation-cap"></i> Class / Year:</label>
            <select id="studentClass" required>
              <option value="">-- Select Class --</option>
              <option value="BA_1st_Year">BA 1st Year</option>
              <option value="BA_2nd_Year">BA 2nd Year</option>
              <option value="BA_3rd_Year">BA 3rd Year</option>
            </select>
          </div>

          <div class="form-group">
            <label><i class="fas fa-layer-group"></i> Category:</label>
            <select id="category" required>
              <option value="">-- Select Category --</option>
              <option value="OBC">OBC</option>
              <option value="SC">SC</option>
              <option value="ST">ST</option>
              <option value="Minority">Minority</option>
              <option value="General">General</option>
            </select>
          </div>

          <div class="form-group">
            <label><i class="fas fa-file-pdf"></i> Upload PDF Form:</label>
            <input type="file" id="pdfFile" accept=".pdf" required>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Submit & Get Proof
          </button>
        </form>

        <!-- Success Proof / Receipt Box -->
        <div id="receiptBox">
          <h4><i class="fas fa-check-circle"></i> Upload Successful!</h4>
          <p><b>Name:</b> <span id="rName"></span></p>
          <p><b>Class:</b> <span id="rClass"></span></p>
          <p><b>Category:</b> <span id="rCategory"></span></p>
          <p><b>App ID:</b> <span id="rAppId" style="color: #d97706; font-weight: bold;"></span></p>
          <p style="font-size: 0.75rem; color: #64748b; margin-top: 8px;">* College mein jama karne ke liye iska screenshot le lein.</p>
          <button class="print-slip-btn" onclick="window.print()"><i class="fas fa-print"></i> Print / Screenshot Slip</button>
        </div>
      </div>

      <!-- TAB 2: DOWNLOAD / RETRIEVE FORM -->
      <div id="downloadTab" class="tab-content">
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">Apna Application ID (jaise: <b>KRMC_123456</b>) ya Apna Naam daal kar form dhoondhein aur download karein:</p>
        <div class="form-group">
          <label><i class="fas fa-search"></i> Enter Application ID or Student Name:</label>
          <input type="text" id="searchQuery" placeholder="e.g. KRMC_123456 ya Rahul">
        </div>
        <button type="button" class="submit-btn" id="searchBtn" onclick="searchForm()">
          <i class="fas fa-search"></i> Search Form
        </button>

        <div id="searchResults" style="margin-top: 15px;"></div>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzoFowaM3hb2QyXNqbl-MKgFUKea-Qy4IV2jLTy0dziUX4O7tHHW_OesCbI0UBYWMw3Iw/exec';

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Upload Form Handling
    document.getElementById('scholarshipUploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      var name = document.getElementById('studentName').value.trim();
      var studentClass = document.getElementById('studentClass').value;
      var category = document.getElementById('category').value;
      var fileInput = document.getElementById('pdfFile').files[0];
      var submitBtn = document.getElementById('submitBtn');
      
      if (!fileInput) return alert('Kripya PDF file select karein.');
      
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
      submitBtn.disabled = true;
      
      var reader = new FileReader();
      reader.onload = function(event) {
        var payload = {
          name: name,
          studentClass: studentClass,
          category: category,
          fileName: fileInput.name,
          fileData: event.target.result
        };
        
        fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(data => {
            if(data.status === 'success') {
                document.getElementById('scholarshipUploadForm').style.display = 'none';
                document.getElementById('rName').innerText = name;
                document.getElementById('rClass').innerText = studentClass;
                document.getElementById('rCategory').innerText = category;
                document.getElementById('rAppId').innerText = data.appId;
                document.getElementById('receiptBox').style.display = 'block';
            } else {
                alert('Upload failed: ' + data.message);
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit & Get Proof';
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            alert('Technial error. Kripya punah prayas karein.');
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit & Get Proof';
            submitBtn.disabled = false;
        });
      };
      reader.readAsDataURL(fileInput);
    });

    // REAL DOWNLOAD SEARCH FUNCTION
    function searchForm() {
      var query = document.getElementById('searchQuery').value.trim();
      var resultsDiv = document.getElementById('searchResults');
      var searchBtn = document.getElementById('searchBtn');

      if (!query) {
        alert('Kripya Application ID ya Name daalein.');
        return;
      }

      searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
      searchBtn.disabled = true;
      resultsDiv.innerHTML = '';

      fetch(scriptURL + '?q=' + encodeURIComponent(query))
      .then(res => res.json())
      .then(data => {
        searchBtn.innerHTML = '<i class="fas fa-search"></i> Search Form';
        searchBtn.disabled = false;

        if (data.status === 'success' && data.results.length > 0) {
          data.results.forEach(file => {
            var card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
              <p><b>File Name:</b> ${file.name}</p>
              <div class="btn-group">
                <a href="${file.url}" target="_blank" class="dl-btn dl-btn-view"><i class="fas fa-eye"></i> View PDF</a>
                <a href="${file.downloadUrl}" target="_blank" class="dl-btn dl-btn-down"><i class="fas fa-download"></i> Download</a>
              </div>
            `;
            resultsDiv.appendChild(card);
          });
        } else {
          resultsDiv.innerHTML = '<p style="color: red; text-align: center; font-size: 0.85rem;">Koi form nahi mila. Sahi App ID ya Naam daalein.</p>';
        }
      })
      .catch(err => {
        searchBtn.innerHTML = '<i class="fas fa-search"></i> Search Form';
        searchBtn.disabled = false;
        resultsDiv.innerHTML = '<p style="color: red; text-align: center; font-size: 0.85rem;">Searching mein dikkat aai. Dobara try karein.</p>';
      });
    }
  </script>
</body>
</html>
